<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    /* Matches the brand mark: eggshell paper, ink-black-500 accent. Inverts
       to the dark-theme canvas and accent step where the browser supports it. */
    .canvas { fill: #f8f5ed; }
    .mark { fill: #496ab6; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0a0f1a; }
      .mark { fill: #92a5d3; }
    }
  </style>
  <rect class="canvas" width="32" height="32" rx="7"/>
  <rect class="mark" x="9" y="9" width="14" height="14" rx="4"/>
</svg>
