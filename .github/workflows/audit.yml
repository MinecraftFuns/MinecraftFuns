name: Audit site

# Browser audit. Reports, never blocks.
#
# A separate workflow, not a job in deploy.yml: deploy.yml serializes whole
# runs through its `pages` concurrency group, so an older build can never
# overwrite a newer deployment, and every job it contains extends the lock the
# next push waits on. Nothing here holds that lock.
#
# The build still comes from the workflow deploy.yml builds through, so the
# browser examines the tree production receives. Findings land in the job
# summary and in a downloadable artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# No concurrency group, unlike deploy.yml: audits of different commits share
# nothing and gate nothing, so they are free to run side by side. Each run
# keeps its own summary and artifact; there is no "latest" to protect.

jobs:
  # The canonical deployment only: joefang.org at the root is the primary
  # target, so that is the configuration worth holding to standard. A failure
  # here is not a new signal, because the same commit is failing the same
  # shared pipeline in deploy.yml; the non-blocking promise above concerns
  # the audit itself, which cannot gate anything.
  build:
    name: Build
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      targets: canonical

  audit:
    name: Audit standalone build
    needs: build
    runs-on: ubuntu-latest
    # Generous, because the failure this guards against is a hang, not slowness:
    # a browser walking every route can legitimately take a long time, and the
    # run that gets killed part-way teaches nothing while costing a full build.
    # Nothing waits on this job, so a stuck one delays no deployment; the only
    # thing the limit has to do is stop a wedged run from occupying a runner
    # indefinitely.
    timeout-minutes: 60
    # A crashed audit is a finding about the audit, not about the site; keep
    # it from reddening the commit so a red mark still means "deploy broken".
    continue-on-error: true
    permissions:
      contents: read
    steps:
      # The source is for the audit driver and its dependencies; the site
      # itself arrives below as the shared workflow's checked artifact.
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Set up Node and dependencies
        uses: ./.github/actions/setup

      # Latest stable Chrome rather than the Chromium the pinned Playwright
      # ships: the driver stays reproducible through the lockfile while the
      # rendering engine tracks what readers actually run. One engine only;
      # three would triple the runtime for findings that are, at this level,
      # almost entirely engine-independent.
      - name: Install latest stable Chrome
        run: npx playwright install --with-deps chrome

      # Byte-for-byte the artifact the build workflow checked, not a second
      # build of the same commit that could quietly diverge from it.
      - name: Download canonical build
        uses: actions/download-artifact@v7
        with:
          name: ${{ fromJSON(needs.build.outputs.canonical).id }}
          path: dist

      - name: Audit
        env:
          SITE_URL: ${{ fromJSON(needs.build.outputs.canonical).origin }}
          SITE_BASE: ${{ fromJSON(needs.build.outputs.canonical).base }}
        run: npm run audit

      - name: Publish report to job summary
        if: always()
        run: cat audit/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload findings and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: page-audit
          path: audit/
          retention-days: 14
          if-no-files-found: warn
          overwrite: true
